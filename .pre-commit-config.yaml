# pre-commit runs these checks automatically on every `git commit`.
# Install once per clone:  uv run pre-commit install
# Run on all files:        uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch # never commit directly on the long-lived branches
        args: [--branch, dev, --branch, test, --branch, prod]

  # Python lint (with safe auto-fixes) and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Project-specific hooks that use the tools installed by uv
  - repo: local
    hooks:
      - id: pyright
        name: pyright (type check)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: jira-commit-message
        name: commit message starts with JAR-<number>
        entry: uv run python -m tools.commit_msg
        language: system
        stages: [commit-msg]
